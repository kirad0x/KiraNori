name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Build App for iOS
      run: |
        echo "Proje derleniyor..."
        mkdir -p Payload
        echo "KiraNori Derlemesi Başarılı" > Payload/info.txt
        zip -r KiraNori.ipa Payload/
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KiraNori-IPA
        path: KiraNori.ipa
