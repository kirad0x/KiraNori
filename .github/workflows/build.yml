name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build App for iOS
      run: |
        echo "Proje derleniyor..."
        xcodebuild -project KiraNori.xcodeproj -scheme KiraNori -sdk iphoneos -configuration Release archive -archivePath $PWD/build/KiraNori.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        
        mkdir -p Payload
        mv $PWD/build/KiraNori.xcarchive/Products/Applications/*.app Payload/
        zip -r KiraNori.ipa Payload/
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: KiraNori-IPA
        path: KiraNori.ipa
