name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Generate Xcode Project & Build IPA
      run: |
        echo "KiraNori projesi oluşturuluyor ve derleniyor..."
        
        # Swift Package / Xcode yapısı hazırlığı
        mkdir -p KiraNori.xcodeproj
        
        # Xcodebuild için doğrudan iOS derlemesi yap
        xcodebuild -SDK iphoneos \
                   -target KiraNori \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   || true

        # Uygulama paketini manuel derleyip IPA yap
        mkdir -p build/KiraNori.app
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios15.0 \
               -emit-executable \
               -o build/KiraNori.app/KiraNori \
               App.swift ContentView.swift

        cp Info.plist build/KiraNori.app/Info.plist
        echo "APPL????" > build/KiraNori.app/PkgInfo
        
        if [ -d "Assets.xcassets" ]; then
          cp -r Assets.xcassets build/KiraNori.app/
        fi

        mkdir -p Payload
        cp -r build/KiraNori.app Payload/
        zip -r KiraNori.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KiraNori_IPA
        path: KiraNori.ipa
        
